# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AndrinsPacks-jar
          path: build/libs/
      - name: publish jar to release branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp build/libs/andrins-packs-*.jar out/ && rm -f out/*-sources.jar
          cd out && git init -q -b release && git add -A
          git -c user.name=ci -c user.email=ci@noreply commit -qm "jar ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" release
      - name: dump sources
        if: always()
        run: |
          ./gradlew genSources -q || true
          mkdir -p dump && cd dump
          SJ=$(find ~/.gradle ../.gradle -name "*sources*.jar" -path "*minecraft*" | grep -i client | head -3); echo "$SJ"
          for j in $SJ; do unzip -q -o "$j" 'net/minecraft/client/renderer/entity/ThrownItemRenderer.java' 'net/minecraft/client/renderer/entity/ThrownTridentRenderer.java' 'net/minecraft/client/renderer/entity/state/ThrownTridentRenderState.java' 'net/minecraft/client/renderer/entity/state/ThrownItemRenderState.java' 'net/minecraft/client/renderer/entity/EntityRenderer.java' 'net/minecraft/client/renderer/entity/EntityRendererProvider.java' 2>/dev/null || true; done
          FJ=$(find ~/.gradle -name "fabric-rendering-v1*.jar" | head -1); unzip -l "$FJ" | grep -i EntityRenderer > fabric_rendering.txt
          find . -type f | head
      - name: upload dump
        if: always()
        run: |
          cd dump && git init -q -b dump && git add -A && git -c user.name=ci -c user.email=ci@noreply commit -qm dump
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dump
