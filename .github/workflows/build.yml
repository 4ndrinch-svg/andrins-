# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AndrinsPacks-jar
          path: build/libs/
      - name: publish jar to release branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp build/libs/andrins-packs-*.jar out/ && rm -f out/*-sources.jar
          cd out && git init -q -b release && git add -A
          git -c user.name=ci -c user.email=ci@noreply commit -qm "jar ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" release
      - name: dump minecraft info
        if: always()
        run: |
          C=/home/runner/.gradle/caches/fabric-loom/26.3/minecraft-client.jar
          mkdir dump && cd dump
          unzip -q -o $C 'assets/minecraft/shaders/core/rendertype_lines*' 'assets/minecraft/shaders/core/lightmap*' 'assets/minecraft/shaders/include/*' 'assets/minecraft/items/*spear*' 'assets/minecraft/items/trident.json' 'assets/minecraft/models/item/*spear*' 'assets/minecraft/textures/item/*spear*' 'assets/minecraft/textures/entity/*spear*' 'assets/minecraft/textures/entity/trident*' 2>/dev/null || true
          J=$(find /home/runner/.gradle/caches/fabric-loom -name "minecraft-clientonly-deobf-26.3.jar" | head -1)
          for c in net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.gui.components.EditBox net.minecraft.client.gui.components.ObjectSelectionList 'net.minecraft.client.gui.components.ObjectSelectionList$Entry' net.minecraft.client.gui.components.AbstractSelectionList net.minecraft.client.gui.components.AbstractWidget net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.components.events.ContainerEventHandler net.minecraft.client.renderer.RenderPipelines net.minecraft.client.input.MouseButtonEvent; do echo "### $c"; javap -cp "$J" "$c" > "$(echo $c | tr '$' '_').txt" 2>&1; done
          javap -cp "$J" -p net.minecraft.client.gui.components.AbstractSelectionList > asl_private.txt
          ls -R . | head -80
      - name: upload dump to branch
        if: always()
        run: |
          cd dump && git init -q -b dump && git add -A && git -c user.name=ci -c user.email=ci@noreply commit -qm dump
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dump
