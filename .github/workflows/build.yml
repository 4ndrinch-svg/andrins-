# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AndrinsPacks-jar
          path: build/libs/
      - name: publish jar to release branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp build/libs/andrins-packs-*.jar out/ && rm -f out/*-sources.jar
          cd out && git init -q -b release && git add -A
          git -c user.name=ci -c user.email=ci@noreply commit -qm "jar ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" release
      - name: github release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep '^version=' gradle.properties | cut -d= -f2)
          JAR=$(ls build/libs/andrins-packs-*.jar | grep -v sources)
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$JAR" --clobber
          else
            gh release create "v$V" "$JAR" --title "Andrins Packs v$V (MC 26.3)" --notes "Fabric-Mod für Minecraft 26.3 mit 36 schaltbaren Ressourcenpaketen. Benötigt Fabric API. Im Spiel K drücken für das Pack-Menü."
          fi
      - name: dump sources
        if: always()
        run: |
          ./gradlew genSources -q || true
          mkdir -p dump && cd dump
          for j in $(find ~/.gradle ../.gradle -name "*sources*.jar" -path "*minecraft*" | head -6); do
            unzip -q -o "$j" 'net/minecraft/client/renderer/RenderPipelines.java' 'net/minecraft/client/renderer/rendertype/RenderType.java' 'net/minecraft/client/renderer/rendertype/RenderSetup.java' 'net/minecraft/client/renderer/ShapeRenderer.java' 'net/minecraft/client/renderer/blockentity/BlockEntityRenderer.java' 'net/minecraft/client/multiplayer/ClientChunkCache.java' 'net/minecraft/world/level/chunk/LevelChunk.java' 'net/minecraft/client/renderer/LevelRenderer.java' 'com/mojang/renderpearl/api/pipeline/RenderPipeline.java' 'com/mojang/renderpearl/api/platform/DepthTestFunction.java' 2>/dev/null || true
            unzip -l "$j" | grep -iE "DepthTest|renderpearl/api/pipeline/RenderPipeline|rendertype/RenderTypes|RenderStateShard" | head -5
          done
          for j in $(find ~/.gradle -name "fabric-rendering-v1*sources*.jar" -o -name "fabric-rendering-v1*.jar" | head -3); do unzip -o -q "$j" 'net/fabricmc/fabric/api/client/rendering/v1/level/*' -d fabric 2>/dev/null; done
          find . -type f | head -40
      - name: upload dump
        if: always()
        run: |
          cd dump && git init -q -b dump && git add -A && git -c user.name=ci -c user.email=ci@noreply commit -qm dump
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dump
      - name: clear dump branch
        if: false
        run: |
          mkdir empty && cd empty && git init -q -b dump && echo "leer" > README.md && git add -A && git -c user.name=ci -c user.email=ci@noreply commit -qm "leer"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dump
