# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AndrinsPacks-jar
          path: build/libs/
      - name: inspect minecraft api
        if: always()
        run: |
          J=$(find ~/.gradle .gradle -name "*.jar" -path "*minecraft*" 2>/dev/null | grep -iE "client|merged|minecraft-" | head -20)
          echo "$J"
          for j in $J; do
            if unzip -l "$j" | grep -q "net/minecraft/client/Minecraft.class"; then
              javap -cp "$j" net.minecraft.client.Minecraft | grep -iE "screen|gui" ; 
              javap -cp "$j" com.mojang.blaze3d.platform.InputConstants | grep -E "KEY_K|Type" ;
              javap -cp "$j" net.minecraft.client.KeyMapping | grep -E "KeyMapping\(" ; break
            fi
          done
