# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AndrinsPacks-jar
          path: build/libs/
      - name: publish jar to release branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp build/libs/andrins-packs-*.jar out/ && rm -f out/*-sources.jar
          python3 tools/make_mrpack.py "$(grep '^version=' gradle.properties | cut -d= -f2)" && cp build/libs/*.mrpack out/
          cd out && git init -q -b release && git add -A
          git -c user.name=ci -c user.email=ci@noreply commit -qm "jar ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" release
      - name: github release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep '^version=' gradle.properties | cut -d= -f2)
          JAR=$(ls build/libs/andrins-packs-*.jar | grep -v sources)
          python3 tools/make_mrpack.py "$V"
          PACK=build/libs/Andrins-Packs-$V.mrpack
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$JAR" "$PACK" --clobber
          else
            gh release create "v$V" "$JAR" "$PACK" --title "Andrins Packs v$V (MC 26.3)" --notes "Fabric-Mod für Minecraft 26.3 mit 36 schaltbaren Ressourcenpaketen. Benötigt Fabric API. Im Spiel K drücken für das Pack-Menü."
          fi
      - name: inspect hud api
        if: always()
        run: |
          F=$(find ~/.gradle -name "fabric-rendering-v1-*.jar" | grep -v sources | head -1)
          unzip -l "$F" | grep -iE "hud" | head
          for c in $(unzip -l "$F" | grep -oE "net/fabricmc/fabric/api/client/rendering/v1/hud/[A-Za-z$]+\.class" | sed 's/\.class//; s#/#.#g'); do javap -cp "$F" "$c"; done
          J=$(find ~/.gradle -name "minecraft-clientonly-deobf-26.3.jar" | head -1); C=$(find ~/.gradle -name "minecraft-common-deobf-26.3.jar" | head -1)
          javap -cp "$J" net.minecraft.client.gui.GuiGraphicsExtractor | grep -E " text\(|centeredText|fill\(|textWithBackdrop"
          javap -cp "$C" net.minecraft.sounds.SoundEvents | grep -E "NOTE_BLOCK_PLING|NOTE_BLOCK_BELL|EXPERIENCE_ORB"
          javap -cp "$J" net.minecraft.client.resources.sounds.SimpleSoundInstance | grep forUI
      - name: clear dump branch
        if: always()
        run: |
          mkdir empty && cd empty && git init -q -b dump && echo "leer" > README.md && git add -A && git -c user.name=ci -c user.email=ci@noreply commit -qm "leer"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dump
